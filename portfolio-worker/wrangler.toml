name = "portfolio-worker"
main = "worker.js"
compatibility_date = "2024-09-23"

# ── Biến môi trường (không nhạy cảm) ──
[vars]
GH_OWNER     = "kazinmintori"
GH_REPO      = "Portfolio-cns"
GH_BRANCH    = "main"
GH_DATA_PATH = "data.json"
GH_UPLOAD_DIR = "assets/uploads"

# ── Secrets (nhạy cảm — dùng lệnh bên dưới, KHÔNG commit vào file này) ──
# wrangler secret put GH_PAT         ← dán GitHub PAT vào đây
# wrangler secret put EDIT_PASSWORD  ← đặt mật khẩu edit trang

# ── KV Namespace (tùy chọn — dùng nếu muốn cache data.json phía Worker) ──
# Tạo: wrangler kv namespace create PORTFOLIO_KV
# Sau đó bỏ comment và điền id:
# [[kv_namespaces]]
# binding = "PORTFOLIO_KV"
# id      = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
